# ==========================================================
# PULL SECRET
# ==========================================================

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret

metadata:
  name: ztp3-pull-secret
  namespace: ztp3

spec:
  vaultAuthRef: provisioning-vault-auth

  mount: acm
  type: kv-v2
  path: ztp3/pull-secret

  refreshAfter: 1h

  destination:
    name: pull-secret
    create: true
    overwrite: true
    type: kubernetes.io/dockerconfigjson

---
# ==========================================================
# BMC CREDENTIALS
# ==========================================================

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret

metadata:
  name: ztp3-bmc-credentials
  namespace: ztp3

spec:
  vaultAuthRef: provisioning-vault-auth

  mount: acm
  type: kv-v2
  path: ztp3/bmc

  refreshAfter: 1h

  destination:
    name: bmc-credentials
    create: true
    overwrite: true
    type: Opaque
